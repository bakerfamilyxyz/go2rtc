# Rebases a configurable Reolink source branch onto the latest upstream go2rtc
# release tag, builds a static linux/amd64 binary, and publishes GitHub Releases.
#
# Switch source branch (workflow_dispatch input or edit default SRC below):
#   ucbmckee/topic/reolink-baichuan  (PR AlexxIT/go2rtc#2413, default)
#   fzurita/reolink_protocol           (PR AlexxIT/go2rtc#2263, fallback)
#
# Fork-only: does not open PRs against AlexxIT/go2rtc or upstream PR authors.

name: reolink-refresh

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      src:
        description: "Remote/branch (e.g. ucbmckee/topic/reolink-baichuan)"
        required: false
        default: ucbmckee/topic/reolink-baichuan
      force:
        description: "Rebuild and publish even when inputs are unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  SRC: ${{ github.event.inputs.src || 'ucbmckee/topic/reolink-baichuan' }}
  FORCE: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git and remotes
        run: |
          git config user.name "reolink-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/AlexxIT/go2rtc.git
          git remote add ucbmckee https://github.com/ucbmckee/go2rtc-ucbmckee.git
          git remote add fzurita https://github.com/fzurita/go2rtc.git
          git fetch --all --tags --prune

      - name: Resolve upstream tag and inputs fingerprint
        id: meta
        run: |
          set -euo pipefail
          TAG="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          SRC_REF="${{ env.SRC }}"
          SRC_FULL="$(git rev-parse "$SRC_REF")"
          SRC_SHORT="$(git rev-parse --short "$SRC_FULL")"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DATE_UTC="$(date -u +%Y%m%d)"
          WORKFLOW_SHA="$(sha256sum .github/workflows/reolink-refresh.yml | awk '{print $1}')"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SRC_REF=$SRC_REF" >> "$GITHUB_ENV"
          echo "SRC_FULL=$SRC_FULL" >> "$GITHUB_ENV"
          echo "SRC_SHORT=$SRC_SHORT" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "DATE_UTC=$DATE_UTC" >> "$GITHUB_ENV"
          echo "WORKFLOW_SHA=$WORKFLOW_SHA" >> "$GITHUB_ENV"

      - name: Skip if inputs unchanged since last release
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force=true; building regardless of prior release."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG="$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName \
            -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-reolink\.[0-9]{8}' | head -1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No prior reolink release; will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MANIFEST_DIR="$(mktemp -d)"
          LAST_WORKFLOW=""
          if gh release download "$LATEST_TAG" --repo "${{ github.repository }}" \
            -p reolink-refresh.inputs.json -D "$MANIFEST_DIR" 2>/dev/null; then
            LAST_UPSTREAM="$(jq -r '.upstream_tag' "$MANIFEST_DIR/reolink-refresh.inputs.json")"
            LAST_SRC_REF="$(jq -r '.src_ref' "$MANIFEST_DIR/reolink-refresh.inputs.json")"
            LAST_SRC="$(jq -r '.src_commit' "$MANIFEST_DIR/reolink-refresh.inputs.json")"
            LAST_WORKFLOW="$(jq -r '.workflow_sha // ""' "$MANIFEST_DIR/reolink-refresh.inputs.json")"
          else
            BODY="$(gh api "repos/${{ github.repository }}/releases/tags/${LATEST_TAG}" --jq .body)"
            LAST_UPSTREAM="$(printf '%s\n' "$BODY" | sed -n 's/^upstream_tag: *//p' | head -1)"
            LAST_SRC_REF="$(printf '%s\n' "$BODY" | sed -n 's/^src_ref: *//p' | head -1)"
            LAST_SRC="$(printf '%s\n' "$BODY" | sed -n 's/^src_commit: *//p' | head -1)"
            LAST_WORKFLOW="$(printf '%s\n' "$BODY" | sed -n 's/^workflow_sha: *//p' | head -1)"
          fi
          WORKFLOW_OK=true
          if [ -n "$LAST_WORKFLOW" ]; then
            [ "$LAST_WORKFLOW" = "$WORKFLOW_SHA" ] || WORKFLOW_OK=false
          fi
          if [ "$LAST_UPSTREAM" = "$TAG" ] && [ "$LAST_SRC_REF" = "$SRC_REF" ] && \
             [ "$LAST_SRC" = "$SRC_FULL" ] && [ "$WORKFLOW_OK" = true ]; then
            echo "Inputs unchanged (upstream=$TAG src=$SRC_REF@$SRC_SHORT workflow=$WORKFLOW_SHA); no push or release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Input change: upstream $LAST_UPSTREAM->$TAG src_ref $LAST_SRC_REF->$SRC_REF" \
              "src_commit $LAST_SRC->$SRC_FULL workflow $LAST_WORKFLOW->$WORKFLOW_SHA"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream release tag
        id: rebase
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git checkout -B reolink "$SRC_REF"
          # Committer date = author date so the fork commit is stable across CI runs.
          if ! git -c rebase.committerDateIsAuthorDate=true rebase "$TAG"; then
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            git rebase --abort
            exit 1
          fi
          FORK_COMMIT="$(git rev-parse HEAD)"
          FORK_SHORT="$(git rev-parse --short HEAD)"
          echo "FORK_COMMIT=$FORK_COMMIT" >> "$GITHUB_ENV"
          echo "FORK_SHORT=$FORK_SHORT" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        if: steps.skip.outputs.skip != 'true' && success()
        with:
          go-version: "1.27"

      - name: Build and test
        id: build
        if: steps.skip.outputs.skip != 'true' && success()
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          go build -ldflags "-s -w" -trimpath -o go2rtc_linux_amd64 .
          ./go2rtc_linux_amd64 -version
          file go2rtc_linux_amd64 | grep -q 'statically linked'
          go test ./pkg/reolink/... ./pkg/baichuan/... ./pkg/webrtc/... ./pkg/h264/... ./pkg/h265/...
          sha256sum go2rtc_linux_amd64 | tee go2rtc_linux_amd64.sha256
          VERSION="$(./go2rtc_linux_amd64 -version 2>&1 | awk '{print $3}')"
          SHA256="$(cut -d' ' -f1 go2rtc_linux_amd64.sha256)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Choose unused release tag for today
        if: steps.skip.outputs.skip != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${TAG}-reolink.${DATE_UTC}"
          REL_TAG="$BASE"
          if gh release view "$REL_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            N=2
            while gh release view "${BASE}.${N}" --repo "${{ github.repository }}" >/dev/null 2>&1; do
              N=$((N + 1))
            done
            REL_TAG="${BASE}.${N}"
          fi
          echo "REL_TAG=$REL_TAG" >> "$GITHUB_ENV"
          echo "Using release tag $REL_TAG"

      - name: Publish reolink branch and release
        if: steps.skip.outputs.skip != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$REL_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing release $REL_TAG"
            exit 1
          fi
          jq -n \
            --arg upstream_tag "$TAG" \
            --arg src_ref "$SRC_REF" \
            --arg src_commit "$SRC_FULL" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg fork_commit "$FORK_COMMIT" \
            --arg build_date "$BUILD_DATE" \
            --arg version "$VERSION" \
            --arg sha256 "$SHA256" \
            '{upstream_tag: $upstream_tag, src_ref: $src_ref, src_commit: $src_commit, workflow_sha: $workflow_sha, fork_commit: $fork_commit, build_date: $build_date, version: $version, sha256: $sha256}' \
            > reolink-refresh.inputs.json
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          upstream_tag: $TAG
          src_ref: $SRC_REF
          src_commit: $SRC_FULL
          workflow_sha: $WORKFLOW_SHA
          fork_commit: $FORK_COMMIT
          build_date: $BUILD_DATE
          version: $VERSION
          sha256: $SHA256

          Machine-readable inputs: see asset \`reolink-refresh.inputs.json\`.

          Static linux/amd64 build (CGO_ENABLED=0) from ucbmckee #2413 or fzurita #2263 source, rebased on upstream $TAG.
          EOF
          git push --force-with-lease origin reolink
          gh release create "$REL_TAG" go2rtc_linux_amd64 go2rtc_linux_amd64.sha256 reolink-refresh.inputs.json \
            --title "$REL_TAG" --notes-file "$NOTES_FILE" --repo "${{ github.repository }}"

      - name: Report failure (issue)
        if: failure() && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="reolink-refresh failed"
          STEP="${{ steps.rebase.conclusion == 'failure' && 'rebase' || (steps.build.conclusion == 'failure' && 'build/test' || 'unknown') }}"
          CONFLICTS="${{ steps.rebase.outputs.conflict_files }}"
          BODY="$(cat <<EOF
          Automated **reolink-refresh** workflow failed (${STEP}).

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Upstream tag: \`${TAG:-unknown}\`
          - Source: \`${SRC_REF:-${{ env.SRC }}}\` @ \`${SRC_SHORT:-unknown}\` (\`${SRC_FULL:-unknown}\`)
          - Trigger: ${{ github.event_name }}

          EOF
          )"
          if [ -n "$CONFLICTS" ]; then
            BODY="${BODY}

          **Rebase conflicts:**
          \`\`\`
          ${CONFLICTS}
          \`\`\`
          "
          fi
          BODY="${BODY}

          No changes were pushed to \`reolink\` and no release was published.
          "
          ISSUE_NUM="$(gh issue list --repo "${{ github.repository }}" --search "in:title ${TITLE}" --json number -q '.[0].number' || true)"
          if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
            gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi